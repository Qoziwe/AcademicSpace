[project]
name = "academicspace-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flask>=3.1,<4",
  "flask-sqlalchemy>=3.1,<4",
  "flask-migrate>=4.0,<5",
  "flask-jwt-extended>=4.7,<5",
  "flask-cors>=5.0,<6",
  "marshmallow>=3.23,<4",
  "python-dotenv>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23.0,<24",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1", "black>=24.10,<25"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/migrations/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
