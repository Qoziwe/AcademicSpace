services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: academicspace
      POSTGRES_USER: academicspace
      POSTGRES_PASSWORD: academicspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academicspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://academicspace:academicspace@postgres:5432/academicspace
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
