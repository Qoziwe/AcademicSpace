name: Deploy to GitHub Pages

# Веб-сборка Expo (SPA, output: single) на GitHub Pages.
# Экспорт идёт с baseUrl = /<repo>, т.к. project site отдаётся с подпути.
# 404.html = копия index.html — GitHub Pages не умеет SPA-rewrite, отдаёт
# 404.html на неизвестный путь, оттуда стартует роутер Expo Router.
# .nojekyll — чтобы Pages не выкидывал каталог _expo/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны; текущий не отменяем, чтобы не рвать релиз.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web bundle
        run: npx expo export --platform web
        env:
          EXPO_WEB_BASE_URL: /${{ github.event.repository.name }}

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
